env:
  contexts:
  - excludePaths: []
    name: baseline
    urls:
    - http://dvwa/vulnerabilities/sqli/?id=1&Submit=Submit
    - http://dvwa/
  parameters:
    failOnError: true
    progressToStdout: false
jobs:
- parameters:
    enableTags: false
    maxAlertsPerRule: 10
  type: passiveScan-config
- parameters:
    maxDuration: 1
    url: http://dvwa/
  type: spider
- parameters:
    maxDuration: 0
  type: passiveScan-wait
- parameters:
    format: Long
    summaryFile: /home/zap/zap_out.json
  rules: []
  type: outputSummary
- parameters:
    reportDescription: ''
    reportDir: /zap/wrk/
    reportFile: dvwa-active.html
    reportTitle: ZAP Scanning Report
    template: traditional-html
  type: report
- parameters:
    reportDescription: ''
    reportDir: /zap/wrk/
    reportFile: dvwa-active.json
    reportTitle: ZAP Scanning Report
    template: traditional-json
  type: report
